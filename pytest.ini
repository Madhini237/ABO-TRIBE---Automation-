[pytest]
addopts = -v --tb=short
testpaths = tests
markers =
    login: Login related tests
    signup: Signup related tests
    location: Location selection, search, permission and persistence tests
    nearby_bars: Nearby bars eligibility, sorting and retry tests
    positive: Positive test cases
    negative: Negative test cases
    smoke: Smoke test cases
    regression: Regression test cases