[pytest]
addopts = -v --tb=short
testpaths = tests
markers =
    login: Login related tests
    signup: Signup related tests
    location: Location selection, search, permission and persistence tests
    nearby_bars: Nearby bars eligibility, sorting and retry tests
    coins: Coin balance, Coin History, credit and deduction tests
    coin_history: Coin History display, refresh, empty and failure tests
    coin_credits: Coin credit flows (signup, check-in, referral, profile, game)
    coin_deductions: Coin deduction and eligibility flows
    positive: Positive test cases
    negative: Negative test cases
    smoke: Smoke test cases
    regression: Regression test cases